services:
    dashboard:
        build:
            context: .
            dockerfile: docker/Dockerfile
        # There is no application-level auth, so the localhost bind is the access control.
        ports:
            - '127.0.0.1:8081:8080'
        # Every ${VAR} below is substituted from the repo-root .env, which compose reads on its own
        # — that is where GITHUB_TOKEN comes from, and .env is gitignored and dockerignored so it
        # never enters an image layer.
        #
        # Deliberately NOT `env_file: .env`. That injects the whole file into the container, which
        # would hand the process variables meant only for host scripts (DATABASE_URL among them,
        # pointing at 127.0.0.1 — a different database from the one this file provisions) and would
        # bypass the empty-defaulting below. The list here is the container's contract; .env only
        # fills it in.
        environment:
            # Optional. Without it the dashboard never fetches and simply serves whatever is
            # already in the database — which is a supported way to run, not a broken one. With a
            # workspace attached it is also what clones private repos.
            GITHUB_TOKEN: ${GITHUB_TOKEN:-}
            GITHUB_OWNER: ${GITHUB_OWNER:-Leeloo-AI-RGA-OS}
            # Empty-defaulted, unlike most of this block, so a mounted factory.toml's
            # [organization] still wins: an empty variable is not an override. A literal default
            # here would clobber the file's organization.id on every start, and that id leads every
            # stored primary key — the dashboard would come back empty and read as data loss.
            # ORG_REPOS gets the same treatment for the same reason, one step less severe.
            ORG_ID: ${ORG_ID:-}
            ORG_NAME: ${ORG_NAME:-}
            # Comma-separated; every repo listed is reported combined. This was GITHUB_REPOS, which
            # is now fatal rather than ignored.
            ORG_REPOS: ${ORG_REPOS:-}
            # A literal default, unlike the three above, and the volume below is mounted to match:
            # this is a path INSIDE the container, so a `workspace_root` in a mounted factory.toml
            # is a host path that cannot exist here and clobbering it is the correct outcome. The
            # ORG_* three are host-independent identifiers; this one is not.
            #
            # Consequence: `docker compose up` clones every repo in ORG_REPOS on first boot. Set it
            # empty in .env to keep the stack from checking anything out.
            ORG_WORKSPACE_ROOT: ${ORG_WORKSPACE_ROOT:-/workspaces}
            BASE_BRANCH: ${BASE_BRANCH:-dev}
            # The only cache floor. CACHE_TTL_SECONDS is gone and is now fatal if set.
            SYNC_TTL_SECONDS: ${SYNC_TTL_SECONDS:-60}
            TELEMETRY_SOURCE: ${TELEMETRY_SOURCE:-postgres}
            TELEMETRY_TTL_SECONDS: ${TELEMETRY_TTL_SECONDS:-30}
            # Required, and pointed at the service this file provisions. Not overridable from the
            # host: a factory_dev on the host is a different database from this one, and pointing
            # the container at it would silently split history across two.
            DATABASE_URL: postgres://factory:factory@timescale:5432/factory_dev
            FACTORY_CONFIG: ${FACTORY_CONFIG:-}
        volumes:
            # The checkouts ORG_WORKSPACE_ROOT points at. Mounted unconditionally, unlike the
            # factory.toml below: a named volume is created on demand, so there is no missing
            # source to fail on, and without it every clone would be lost on the next `up`.
            #
            # A named volume rather than a bind mount because the container runs as `node`, which
            # cannot usually write a host directory owned by someone else — and a clone that dies
            # on permissions is a confusing first symptom. Reach the trees with
            # `docker compose exec dashboard sh` or `docker cp`.
            - workspaces:/workspaces
            # A factory.toml has to be mounted in, since it is gitignored and dockerignored and so
            # never enters the image. Left commented because compose errors out when a bind mount's
            # source is missing, which would break `docker compose up` for anyone without the file.
            # Note that most variables above are *real* values, not absent ones, so they win over
            # the file — env-first stays the container's contract. The ORG_* three are the
            # exception, and deliberately so: see the comment on them.
            # - ./factory.toml:/app/factory.toml:ro
        depends_on:
            timescale:
                condition: service_healthy
        restart: unless-stopped
        healthcheck:
            # alpine has no curl, so probe with node's global fetch.
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
                ]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 10s

    # TimescaleDB rather than plain Postgres: metric_point is a real time-series table and
    # becomes a hypertable, while session_branch stays relational so the attribution join is
    # ordinary SQL. One extension, one driver, one dialect.
    timescale:
        image: timescale/timescaledb:latest-pg17
        environment:
            POSTGRES_USER: factory
            POSTGRES_PASSWORD: factory
            # Two databases, deliberately. `npm run test:db` truncates its tables, so it is
            # fenced off to factory_test by a name check in the suite — pointing it at
            # factory_dev would silently destroy backfilled history.
            POSTGRES_DB: factory_dev
        # Localhost-only, same posture as the dashboard: the bind is the access control.
        # Published because `npm run test:db` and psql both run from the host.
        ports:
            - '127.0.0.1:5432:5432'
        volumes:
            - timescale-data:/var/lib/postgresql/data
            # Only runs on a fresh volume, which is why the README also gives the manual
            # `create database` for an existing one.
            - ./docker/init-databases.sh:/docker-entrypoint-initdb.d/10-init-databases.sh:ro
        restart: unless-stopped
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U factory -d factory_dev']
            interval: 5s
            timeout: 5s
            retries: 10
            start_period: 10s

    # Receives from Claude Code on the host and forwards to the dashboard's ingest route.
    # Localhost-only, no auth, no TLS — same posture as everything else here.
    collector:
        image: otel/opentelemetry-collector-contrib:latest
        command: ['--config=/etc/otel/config.yaml']
        volumes:
            - ./docker/otel-collector.yaml:/etc/otel/config.yaml:ro
        ports:
            - '127.0.0.1:4317:4317'
            - '127.0.0.1:4318:4318'
        depends_on:
            - dashboard
        restart: unless-stopped

volumes:
    timescale-data:
    # The organization's checkouts. Survives `docker compose down`; `down -v` discards them, and
    # they are re-cloned on the next boot.
    workspaces:
